name: Build DostCare iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fix known Swift issues in ContentView.swift
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          p = Path("DostCareiOS/ContentView.swift")
          if p.exists():
              text = p.read_text(encoding="utf-8")

              # 1) Fix canAddPhotoOutput() -> canAddOutput(...)
              text = text.replace("self.session.canAddPhotoOutput()", "self.session.canAddOutput(photoOutput)")
              text = text.replace("session.canAddPhotoOutput()", "session.canAddOutput(photoOutput)")

              # 2) Fix guard ... else { return } inside SwiftUI ViewBuilder
              lines = text.splitlines()
              fixed_lines = []
              for line in lines:
                  if "guard " in line and " else { return }" in line:
                      indent = line[:len(line) - len(line.lstrip(" "))]
                      cond = line.strip()
                      # Extract condition between 'guard ' and ' else { return }'
                      inner = cond[len("guard "):-len(" else { return }")].strip()
                      if inner.startswith("!"):
                          neg_cond = inner[1:].strip()
                          if neg_cond.startswith("(") and neg_cond.endswith(")"):
                              neg_cond = neg_cond[1:-1].strip()
                          fixed_lines.append(f"{indent}if {neg_cond} {{")
                      else:
                          fixed_lines.append(f"{indent}if !({inner}) {{")
                  else:
                      fixed_lines.append(line)

              p.write_text("\n".join(fixed_lines) + ("\n" if text.endswith("\n") else ""), encoding="utf-8")
              print("Updated ContentView.swift")
          else:
              print("ContentView.swift not found")
          EOF

      - name: Create project.yml
        run: |
          cat << 'EOF' > project.yml
          name: DostCareiOS
          options:
            bundleIdPrefix: com.dostcare
            deploymentTarget:
              iOS: "15.0"
          targets:
            DostCareiOS:
              type: application
              platform: iOS
              sources:
                - path: DostCareiOS
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.dostcare.ios
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  CODE_SIGN_IDENTITY: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
                  SWIFT_VERSION: "5.9"
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app and package IPA
        run: |
          set -e
          xcodebuild \
            -project DostCareiOS.xcodeproj \
            -scheme DostCareiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          test -n "$APP_PATH"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -r -y ../../DostCare.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DostCare-iOS-IPA
          path: DostCare.ipa
          if-no-files-found: error
