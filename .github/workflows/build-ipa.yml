name: Build DostCare iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project.yml
        run: |
          cat << 'EOF' > project.yml
          name: DostCareiOS
          options:
            bundleIdPrefix: com.dostcare
            deploymentTarget:
              iOS: "16.0"
          targets:
            DostCareiOS:
              type: application
              platform: iOS
              sources:
                - path: DostCareiOS
              info:
                path: DostCareiOS/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.dostcare.ios
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA archive
        run: |
          xcodebuild -project DostCareiOS.xcodeproj \
            -scheme DostCareiOS \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath build/DostCareiOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/ipa/Payload
          cp -R build/DostCareiOS.xcarchive/Products/Applications/DostCareiOS.app build/ipa/Payload/
          cd build/ipa && zip -r ../../DostCare_Unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DostCare-iOS-IPA
          path: DostCare_Unsigned.ipa
